    <script>window.__KP_JOBS__=[{"id":"adf5ef5c-011b-4b76-97af-c84c9a415875","title":"Deployment Technician","description":"\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family: Arial, sans-serif; font-size: 1rem; letter-spacing: -0.011em;\">We’re\nworking with an established technology business that delivers large-scale IT\ndeployments across the UK, supporting some of the country’s best-known\nhospitality and retail brands.\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">They’re\nlooking for a Technical Deployment Coordinator to join their team, taking\nresponsibility for the preparation, configuration and remote support of\ntechnology being rolled out across customer sites.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">This\nwould suit someone from an IT Support, Infrastructure, Systems or Deployment\nbackground who enjoys being hands-on with hardware, networking and Windows\nenvironments and wants to get more involved in project-based technical work.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cb>\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">The\nrole\u003co:p>\u003c/o:p>\u003c/span>\u003c/b>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">You’ll\nwork closely with field engineers and internal project teams to make sure\nequipment and systems are configured, tested and ready ahead of installations.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Your\nday-to-day work will include:\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:36.0pt;text-align:justify;text-indent:-36.0pt;mso-list:l0 level1 lfo1;\ntab-stops:list 14.2pt\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;\nmso-bidi-font-size:12.0pt;line-height:115%;font-family:Symbol;mso-fareast-font-family:\nSymbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; \u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Configuring and testing servers,\nswitches, routers, laptops and other IT hardware\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:36.0pt;text-align:justify;text-indent:-36.0pt;mso-list:l0 level1 lfo1;\ntab-stops:list 14.2pt\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;\nmso-bidi-font-size:12.0pt;line-height:115%;font-family:Symbol;mso-fareast-font-family:\nSymbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; \u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Preparing systems and files ahead of\nengineer deployments\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin- mso-bidi-font-size:12.0pt;line-height:115%;font-family:Symbol;mso-fareast-font-family:\nSymbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; \u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Diagnosing hardware, software and\nnetworking issues\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:36.0pt;text-align:justify;text-indent:-36.0pt;mso-list:l0 level1 lfo1;\ntab-stops:list 14.2pt\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;\nmso-bidi-font-size:12.0pt;line-height:115%;font-family:Symbol;mso-fareast-font-family:\nSymbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; \u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Carrying out quality checks before\nequipment is deployed\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:36.0pt;text-align:justify;text-indent:-36.0pt;mso-list:l0 level1 lfo1;\ntab-stops:list 14.2pt\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;\nmso-bidi-font-size:12.0pt;line-height:115%;font-family:Symbol;mso-fareast-font-family erif\">What\nwe're looking for\u003co:p>\u003c/o:p>\u003c/span>\u003c/b>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">We're\nnot too concerned about your current job title. You could currently be working\nas an IT Support Engineer, Infrastructure Engineer, Systems Engineer,\nDeployment Engineer or in a similar hands-on technical position.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">What\nmatters is that you're comfortable working with:\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:14.2pt;text-align:justify;text-indent:-14.2pt;mso-list:l1 level1 lfo2\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;mso-bidi-font-size:12.0pt;line-height:115%;font-family:\nSymbol;mso-fareast-font-family:Symbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\n\u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Windows\nServer\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:14.2pt;text-align:justify;text-indent:-14.2pt;mso-list:l1 level1 lfo2\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;mso-bidi-font-size:12.0pt;line-height:115%;font-family:\nSymbol;mso-fareast-font-family:Symbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\n\u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Networking,\nswitches and routers\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:14.2pt;text-align:justify;text-indent:-14.2pt;mso-list:l1 level1 lfo2\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;mso-bidi-font-size:12.0pt;line-height:115%;font-family:\nSymbol;mso-fareast-font-family:Symbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\n\u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Hardware\nconfiguration and troubleshooting\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:14.2pt;text-align:justify;text-indent:-14.2pt;mso-list:l1 level1 lfo2\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;mso-bidi-font-size:12.0pt;line-height:115%;font-family:\nSymbol;mso-fareast-font-family:Symbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\n\u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">VMware\nand/or Hyper-V\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:14.2pt;text-align:justify;text-indent:-14.2pt;mso-list:l1 level1 lfo2\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;mso-bidi-font-size:12.0pt;line-height:115%;font-family:\nSymbol;mso-fareast-font-family:Symbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\n\u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Remote\ntechnical support\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-left:14.2pt;text-align:justify;text-indent:\n-14.2pt;mso-list:l1 level1 lfo2\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:\n10.0pt;mso-bidi-font-size:12.0pt;line-height:115%;font-family:Symbol;\nmso-fareast-font-family:Symbol;mso-bidi-font-family:Symbol\">·\u003cspan style=\"font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-stretch: normal; font-size: 7pt; line-height: normal; font-family: &quot;Times New Roman&quot;;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\n\u003c/span>\u003c/span>\u003c!--[endif]-->\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Basic\nscripting or PowerShell\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">You'll\nneed to be comfortable working independently, troubleshooting issues when\nthings don't go to plan and communicating with engineers during live\ndeployments.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cb>\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Working\nhours\u003co:p>\u003c/o:p>\u003c/span>\u003c/b>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">The\nstandard working week is \u003cb>Monday-Friday, 9:00am-5:30pm\u003c/b>.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">As\npart of the role, you'll also support planned overnight deployment work. This\nis typically \u003cb>Sunday-Thursday, within a 10:00pm-6:00am window\u003c/b>, working\nremotely from home.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">Night\ndeployment support is generally required for around one week per month,\nalthough some projects may require two weeks in a month. The role comes with a\npercentage-based bonus on top of the £32,000 basic salary to reflect the\nadditional deployment work.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-family:&quot;Arial&quot;,sans-serif\">If\nyou've got a solid grounding in infrastructure, networking and hardware and\nwant a role where you'll be involved in genuine technical deployments rather\nthan sitting on a service desk all day, we'd be keen to speak with you.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\">\u003co:p>&nbsp;\u003c/o:p>\u003c/p>","discipline":"Technology","type":"Hybrid","location":"Greater Manchester, UK","salary":"£32,000 per annum + Shift Allowance","benefits":["25 days annual leave"],"is_active":true,"created_at":"2026-11-03T10:48:44.782428+00:00"},{"id":"5e8951eb-cfc2-4693-9de6-e19fa4de3b84","title":"Web Application Developer","description":"\u003ch1>\u003cspan style=\"color: rgb(10, 46, 26); font-family: &quot;Neue Helvetica&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; font-size: 1.25rem; letter-spacing: -0.011em;\">ABOUT OUR CLIENT\u003c/span>\u003c/h1>\u003cp>Our client is a highly successful and profitable engineering technology business, developing innovative software and hardware solutions for customers across automotive, robotics, autonomous systems and advanced engineering markets worldwide.\u003c/p>\u003cp>With continued growth and investment in its technology function, the company is expanding its software development capability, with a particular focus on modernising and developing its suite of web-based applications.\u003c/p>\u003cp>Combining the financial stability of an established business with an innovative, product-focused engineering culture, this is an excellent opportunity to join a company where software plays an increasingly important role in its future growth.\u003c/p>\u003ch2>ABOUT THE ROLE\u003c/h2>\u003cp>We're looking for an experienced Senior Software Engineer with strong C#/.NET and React experience to join a collaborative, multidisciplinary development team based near Bicester.\u003c/p>\u003cp>This is a full-stack, product-focused development position, with a particular emphasis on building, enhancing and modernising web applications using C#/.NET on the backend and React on the frontend.\u003c/p>\u003cp>You'll be working on applications that support the company's wider technology portfolio, including platforms used to configure products, visualise complex data, monitor performance and provide customers with intuitive, feature-rich interfaces.\u003c/p>\u003cp>Working alongside other Software Engineers, as well as Electronics, Firmware and Systems Engineering teams, you'll contribute to the design and delivery of modern, scalable applications that interact with sophisticated engineering technologies.\u003c/p>\u003cp>You'll have the opportunity to influence technical decisions, introduce new ideas and play a key role in shaping the company's evolving web application architecture.\u003c/p>\u003ch2>THE ROLE\u003c/h2>\u003cul>\u003cli>\u003cp>Design, develop and maintain modern \u003cstrong>web applications using C#/.NET and React\u003c/strong>.\u003c/p>\u003c/li>\u003cli>\u003cp>Build robust, scalable backend services and RESTful APIs using .NET.\u003c/p>\u003c/li>\u003cli>\u003cp>Develop responsive, intuitive frontend interfaces using React, JavaScript and TypeScript.\u003c/p>\u003c/li>\u003cli>\u003cp>Work on data-rich applications, including dashboards, visualisation tools and product configuration interfaces.\u003c/p>\u003c/li>\u003cli>\u003cp>Contribute to the modernisation of existing software applications and the development of new web-based products.\u003c/p>\u003c/li>\u003cli>\u003cp>Collaborate with Software, Electronics, Firmware and Systems Engineers to integrate applications with wider engineering systems.\u003c/p>\u003c/li>\u003cli>\u003cp>Participate in architectural decisions, technical discussions, peer reviews and code reviews.\u003c/p>\u003c/li>\u003cli>\u003cp>Write clean, maintainable and well-tested code, following modern software engineering best practices.\u003c/p>\u003c/li>\u003cli>\u003cp>Take ownership of features throughout the full software development lifecycle, from initial requirements through to deployment and ongoing improvement.\u003c/p>\u003c/li>\u003c/ul>\u003ch2>WHAT ARE WE LOOKING FOR?\u003c/h2>\u003cul>\u003cli>\u003cp>Strong commercial software development experience using \u003cstrong>C# and .NET / ASP.NET Core\u003c/strong>.\u003c/p>\u003c/li>\u003cli>\u003cp>Hands-on experience developing modern frontend applications using \u003cstrong>React\u003c/strong>.\u003c/p>\u003c/li>\u003cli>\u003cp>Good knowledge of \u003cstrong>JavaScript and/or TypeScript\u003c/strong>, HTML and CSS.\u003c/p>\u003c/li>\u003cli>\u003cp>Experience designing, developing and integrating RESTful APIs.\u003c/p>\u003c/li>\u003cli>\u003cp>A solid understanding of object-oriented programming, software architecture and design principles.\u003c/p>\u003c/li>\u003cli>\u003cp>Experience working with relational databases, ideally SQL Server or similar.\u003c/p>\u003c/li>\u003cli>\u003cp>Familiarity with modern software development practices, including Git, automated testing and CI/CD.\u003c/p>\u003c/li>\u003cli>\u003cp>The ability to work confidently across both frontend and backend development.\u003c/p>\u003c/li>\u003cli>\u003cp>Strong problem-solving skills and the ability to work collaboratively within a technically experienced engineering team.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Desirable, but not essential:\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>Previous experience developing applications for engineering, scientific, industrial or hardware-related products.\u003c/p>\u003c/li>\u003cli>\u003cp>Experience working with real-time data, data visualisation or complex dashboard applications.\u003c/p>\u003c/li>\u003cli>\u003cp>Exposure to Azure or other cloud platforms.\u003c/p>\u003c/li>\u003cli>\u003cp>Knowledge of desktop technologies such as WPF, or experience migrating desktop applications towards modern web-based solutions.\u003c/p>\u003c/li>\u003cli>\u003cp>An interest in emerging technologies and modern approaches to application development.\u003c/p>\u003c/li>\u003c/ul>\u003ch2>WHAT'S ON OFFER?\u003c/h2>\u003cul>\u003cli>\u003cp>\u003cstrong>Salary up to £45k&nbsp;\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>Discretionary annual profit share bonus\u003c/p>\u003c/li>\u003cli>\u003cp>Hybrid working – 4 days in the office, 1 day from home\u003c/p>\u003c/li>\u003cli>\u003cp>27 days' annual leave plus bank holidays\u003c/p>\u003c/li>\u003cli>\u003cp>5% employee / 5% employer pension (Scottish Widows salary sacrifice scheme)\u003c/p>\u003c/li>\u003cli>\u003cp>Private Medical Insurance\u003c/p>\u003c/li>\u003cli>\u003cp>Group Income Protection\u003c/p>\u003c/li>\u003cli>\u003cp>Death in Service Scheme\u003c/p>\u003c/li>\u003cli>\u003cp>Electric Vehicle Scheme\u003c/p>\u003c/li>\u003cli>\u003cp>Smart casual dress code\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Our client is also happy to consider candidates seeking a four-day working week\u003c/strong>, offering genuine flexibility around working arrangements.\u003c/p>\u003cp>This is an excellent opportunity for a Senior Software Engineer who enjoys working across the full stack and wants to develop modern web applications within a technically sophisticated, product-led engineering business.\u003c/p>\u003cp>You'll be joining a financially strong, growing organisation where your work will have a direct influence on the development of innovative products used by customers around the world.\u003c/p>","discipline":"Technology","type":"Hybrid","location":"Oxford, Oxfordshire UK","salary":"£40,000 - £45,000 per annum","benefits":["Bonus, 27 days annual leave"],"is_active":true,"created_at":"2026-11-03T10:37:56.948536+00:00"},{"id":"44d83303-0529-45f4-ae4a-3f7853027869","title":"Senior Software Engineer","description":"\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cb>\u003cspan style=\"font-size:11.0pt;\nline-height:115%;font-family:Poppins\">About our Client\u003co:p>\u003c/o:p>\u003c/span>\u003c/b>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:11.0pt;\nline-height:115%;font-family:Poppins\">Our client is a highly profitable,\nfast-paced engineering technology business with annual revenues of\napproximately £20 million and growing. They design and manufacture\nworld-leading navigation and sensor technologies, supplying customers across\nautomotive, autonomous vehicles, robotics, defence and advanced engineering\nmarkets worldwide.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cb>\u003cspan style=\"font-size:11.0pt;\nline-height:115%;font-family:Poppins\">About the role \u003co:p>\u003c/o:p>\u003c/span>\u003c/b>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:11.0pt;\nline-height:115%;font-family:Poppins\">Following continued growth and investment\nin their software capability, they are looking to appoint a Senior Software\nEngineer to join their collaborative development team based near Bicester.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:11.0pt;\nline-height:115%;font-family:Poppins\">This is a genuine product development\nrole. You'll be working on software that directly interfaces with sophisticated\nhardware, developing applications used to configure products, visualise\nengineering data, support diagnostics and testing, and deliver new\nfunctionality across the company's product portfolio.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:11.0pt;\nline-height:115%;font-family:Poppins\">Working closely with Software,\nElectronics, Firmware and Systems Engineers, you'll play an important role in\nshaping the next generation of products while helping to modernise and enhance\nexisting applications.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cb>\u003cspan style=\"font-size:11.0pt;\nline-height:115%;font-family:Poppins\">The Role\u003co:p>\u003c/o:p>\u003c/span>\u003c/b>\u003c/p>\n\n\u003cp class=\"MsoNormal\" styl pan style=\"font-size:11.0pt;line-height:115%;font-family:Poppins\">Smart casual\ndress code \u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cb>\u003cspan style=\"font-size:11.0pt;\nline-height:115%;font-family:Poppins\">Our client is also happy to consider\ncandidates seeking a four-day working week, offering genuine flexibility around\nworking arrangements.\u003c/span>\u003c/b>\u003cspan style=\"font-size:11.0pt;line-height:115%;\nfont-family:Poppins\">\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:11.0pt;\nline-height:115%;font-family:Poppins\">This is an excellent opportunity to join\na financially strong, growing engineering business where software is central to\nthe success of the product. You'll work alongside a highly experienced team on\ntechnically challenging projects, with the opportunity to make a real impact on\nproducts used by customers around the world.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\">\u003cspan style=\"font-family:Poppins\">&nbsp;\u003c/span>\u003c/p>","discipline":"Technology","type":"Hybrid","location":"Oxford, Oxfordshire UK","salary":"£70,000 - £75,000 per annum","benefits":[],"is_active":true,"created_at":"2026-11-03T10:36:00.607808+00:00"},{"id":"ad2f49a7-f89b-4a78-a526-3027833cd9cd","title":"Software Tester","description":"\u003ch2>ABOUT OUR CLIENT\u003c/h2>\u003cp>We're partnering with an established, growing software company that develops specialist cloud-based SaaS solutions for customers across the UK and international markets.\u003c/p>\u003cp>The business has built a strong reputation for delivering reliable, high-quality software and continues to invest in its technology, product development and engineering teams.\u003c/p>\u003cp>Despite its established market presence, the company maintains a collaborative, forward-thinking culture where individuals are encouraged to contribute ideas, challenge existing processes and play an active role in improving the products they deliver.\u003c/p>\u003ch2>ABOUT THE ROLE\u003c/h2>\u003cp>We're looking for a \u003cstrong>Mid-Level QA Engineer\u003c/strong> to join an experienced, collaborative Quality Assurance team, working closely with Software Engineers, Product Owners and other stakeholders.\u003c/p>\u003cp>This is a hands-on position offering a good balance between \u003cstrong>Test Automation (approximately 60%) and Manual Testing (40%)\u003c/strong>, with the opportunity to take ownership of testing activities across a suite of cloud-based software products.\u003c/p>\u003cp>You'll be involved throughout the software development lifecycle, helping to ensure new features, enhancements and releases meet the company's high standards for quality, performance and reliability.\u003c/p>\u003cp>Key responsibilities will include:\u003c/p>\u003cul>\u003cli>\u003cspan style=\"font-size: 1rem; letter-spacing: -0.011em;\">Developing, maintaining and improving automated test scripts and frameworks.\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"font-size: 1rem; letter-spacing: -0.011em;\">Performing functional, regression, exploratory and end-to-end testing.\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"font-size: 1rem; letter-spacing: -0.011em;\">Working closely with developers to identify, investigate and resolve defects.\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"font-size: 1rem; letter-spacing: -0.011em;\">Contributing to test planning, execution and continuous improvements across QA processes.\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"font-size: 1rem; letter-spacing: -0.011em;\">Testing REST APIs and validating integrations between different systems.\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"font-size: 1rem; letter-spacing: -0.011em;\">Supporting automated testing within CI/CD pipelines.\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"font-size: 1rem; letter-spacing: -0.011em;\">Exploring opportunities to improve testing efficiency through emerging technologies, including AI-assisted testing tools.\u003c/span>\u003c/li>\u003c/ul>\u003cp>This is an excellent opportunity for a QA Engineer who has developed a solid foundation in automation and is looking to further strengthen their technical skills within an experienced team.\u003c/p>\u003ch2>WHAT ARE WE LOOKING FOR?\u003c/h2>\u003cul>\u003cli>\u003cp>\u003cstrong>3+ years' commercial experience\u003c/strong> in Software Testing / Quality Assurance.\u003c/p>\u003c/li>\u003cli>\u003cp>Hands-on experience with test automation, ideally using \u003cstrong>Cypress with JavaScript or TypeScript\u003c/strong>. Experience with Playwright or Selenium will also be considered.\u003c/p>\u003c/li>\u003cli>\u003cp>Previous experience testing \u003cstrong>SaaS applications or cloud-based software platforms\u003c/strong>.\u003c/p>\u003c/li>\u003cli>\u003cp>Strong understanding of manual testing techniques, including functional, regression, exploratory and end-to-end testing.\u003c/p>\u003c/li>\u003cli>\u003cp>Experience testing REST APIs using tools such as \u003cstrong>Postman\u003c/strong>.\u003c/p>\u003c/li>\u003cli>\u003cp>Familiarity with Agile development environments and the software development lifecycle.\u003c/p>\u003c/li>\u003cli>\u003cp>Some exposure to CI/CD pipelines and automated testing practices.\u003c/p>\u003c/li>\u003cli>\u003cp>Good communication skills and the confidence to collaborate with developers and wider product teams.\u003c/p>\u003c/li>\u003cli>\u003cp>A proactive approach to problem-solving, with a genuine interest in software quality and continuous improvement.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Desirable, but not essential:\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>ISTQB certification.\u003c/p>\u003c/li>\u003cli>\u003cp>Experience using AI-powered tools to support software testing.\u003c/p>\u003c/li>\u003cli>\u003cp>Exposure to improving or extending existing test automation frameworks.\u003c/p>\u003c/li>\u003c/ul>\u003ch2>\u003cbr>\u003c/h2>","discipline":"Technology","type":"Hybrid","location":"Bristol, Gloucestershire","salary":"£45,000 - £50,000 per annum","benefits":[],"is_active":true,"created_at":"2026-11-03T10:34:58.443996+00:00"},{"id":"801e40e1-359f-48df-a118-972a4c6706ea","title":"QA Automation Engineer","description":"\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cb>\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">ABOUT OUR CLIENT\u003co:p>\u003c/o:p>\u003c/span>\u003c/b>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">Our Client is a fast-growing FinTech\ncompany developing cloud-based SaaS platforms for financial institutions across\nthe UK, Australia, New Zealand and Asia.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">Backed by a $1 billion investment firm\nbased in San Francisco, the business has enjoyed another strong year, achieving\n25% revenue growth whilst continuing to invest in its technology, people and\ninternational expansion.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">Having operated successfully for over 30\nyears, the company offers the stability and experience of an established\nbusiness, combined with the energy of a start-up experiencing rapid but\nsustainable growth.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cb>\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">ABOUT THE ROLE\u003co:p>\u003c/o:p>\u003c/span>\u003c/b>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">We’re looking for a strong QA Engineer to\njoin a close-knit team of circa 5 QA professionals that are working alongside\nteam of 10-15 Software Engineers.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">Quality is taken very seriously here. In\nthe 30 years our client has been in business, their software has never caused a\nday’s disruption for their customers. Their reputation for reliability is\nhugely important to them. \u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">This role will focus primarily on Test\nAutomation (60%), alongside, of course, manual and exploratory testing. You’ll\ndevelop and maintain automated test suites, improve test coverage, and work\nclosely with the wider product team throughout the full SDLC.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">The business is also exploring how AI and\nAgentic Testing can improve its QA processes, so previous experience using AI\nwithin software testing would be a real advantage.\u003co:p>\u003c/o:p>\u003c/span>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"text-align:justify\">\u003cb>\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family:Poppins\">WHAT ARE WE LOOKING FOR?\u003co:p>\u003c/o:p>\u003c/span>\u003c/b>\u003c/p>\n\n\u003cp class=\"MsoNormal\" style=\"margin-top:0cm;margin-right:0cm;margin-bottom:0cm;\nmargin-left:14.2pt;text-align:justify;text-indent:-14.2pt;mso-list:l0 level1 lfo1;\ntab-stops:list 14.2pt\">\u003c!--[if !supportLists]-->\u003cspan style=\"font-size:10.0pt;\nline-height:106%;font-family
