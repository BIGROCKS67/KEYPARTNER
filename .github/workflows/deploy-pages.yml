# Builds the site and commits the output to docs/ on main.
# GitHub Pages: Settings → Pages → Deploy from a branch → main /docs
name: Pages, build into docs/

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
  # Rebuild every hour so roles added or closed in /admin get their own
  # static page and sitemap entry. Nothing is committed if no role changed.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: pages-docs-main
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build is a static site (not dev index.html)
        run: |
          grep -qE '/assets/' dist/index.html || { echo 'dist/index.html must load hashed bundles under /assets/'; sed -n '1,40p' dist/index.html; exit 1; }
          grep -q 'src/main.jsx' dist/index.html && { echo 'dist/index.html must not reference /src/main.jsx'; exit 1; } || true

      - name: Write site to docs/ on main
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: dist
          target-folder: docs
          clean: true
          commit-message: 'chore(pages): publish site to docs/'
